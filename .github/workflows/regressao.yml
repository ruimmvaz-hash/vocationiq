name: Regressao candidatas (item 7)

# GATE automático pedido pelo Rui (auditoria de 19 Set, item 7: "cobertura +
# automação"). Corre a suite de regressão (web/scripts/regressao/verificar.ts)
# em cada push/PR para master e assinala se alguma candidata da baseline
# aprovada desaparecer ou perder nível de confiança — nunca requer
# segredos/API keys, porque o script nunca geocodifica (usa sempre as
# coordenadas fixas de cada fixture) nem chama a Anthropic (só recalcula o
# catálogo determinístico, nunca gera texto). Ver docs/REGRESSAO.md e
# web/scripts/regressao/fixtures.ts para o porquê de cada cliente real estar
# ou não coberto.
#
# ESTADO TEMPORÁRIO (21 Set) — `continue-on-error: true` no passo de baixo:
# a Melina e a Nádia já têm diffs conhecidos e aceites (ver docs/REGRESSAO.md)
# que fazem este passo falhar em TODO o push, mesmo sem regressão nova —
# e cada falha disparava um email do GitHub por run. Isto silencia esse
# ruído sem esconder o resultado (fica um aviso "::warning::" visível na
# aba Actions do GitHub em cada run que falhe). Assim que o Rui validar o
# PDF da Nádia e a baseline for recapturada (ou o Miguel tiver a dele
# própria), REMOVER o `continue-on-error` e este bloco de comentário —
# volta a ser um gate a sério, que bloqueia e avisa por email de verdade.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  regressao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependências (workspaces)
        run: npm ci

      - name: Verificar regressão de candidatas
        id: regressao
        continue-on-error: true
        run: npm run regressao
        working-directory: web

      - name: Aviso se falhou (não bloqueia enquanto o estado acima for verdade)
        if: steps.regressao.outcome == 'failure'
        run: echo "::warning::npm run regressao falhou — mais provável os diffs já conhecidos da Melina/Nádia (docs/REGRESSAO.md), não necessariamente uma regressão nova. Corre 'npm run regressao' localmente para ver a lista exacta antes de assumir que está tudo bem."
